<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My IP_v4_v6</title>
</head>
<body>
	<div id="v4"></div>
	<div id="v6"></div>

	<script type="text/javascript">
		fetch("https://v4.example.com")
			.then((response) => response.json())
			.then(data_v4 => {
				const v4_div = document.getElementById('v4');
				v4_div.innerHTML = `
					<h4>IPv4</h4>
					<p>ip: <b>${data_v4.ip}</b> | remote port: <b>${data_v4.port}</b></p>
				`
			})

		fetch("https://v6.example.com")
			.then((response) => response.json())
			.then(data_v6 => {
				const v6_div = document.getElementById('v6');
				v6_div.innerHTML = `
					<h4>IPv6</h4>
					<p>ip: <b>${data_v6.ip}</b> | remote port: <b>${data_v6.port}</b></p>
				`
		})
	</script>
</body>
</html>
